services:
  postgres:
    image: postgres:16-alpine
    container_name: bk-parking-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-bk_parking}
      POSTGRES_USER: ${DB_USER:-bkparking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bkparking123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bkparking} -d ${DB_NAME:-bk_parking}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bk-parking-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bk_parking}
      DB_USER: ${DB_USER:-bkparking}
      DB_PASSWORD: ${DB_PASSWORD:-bkparking123}
      JWT_SECRET: ${JWT_SECRET:-BkParkingMvpSecretKeyForJwtSigning2026VeryLongAndSecureKey123456}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      VEHICLE_DOCUMENTS_DIR: /app/uploads/vehicle-documents
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: bk-parking-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
